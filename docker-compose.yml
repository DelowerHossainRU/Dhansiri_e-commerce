services:
  mongo:
    image: mongo:7.0
    container_name: dhansiri-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: dhansiri_agro
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dhansiri-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhansiri-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/dhansiri_agro
      CLIENT_URL: http://localhost,http://localhost:80,http://127.0.0.1
      JWT_SECRET: ${JWT_SECRET:-dhansiri_production_super_secure_jwt_secret_2026_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dhansiri_production_refresh_jwt_secret_2026_key}
      JWT_EXPIRE: 7d
      JWT_REFRESH_EXPIRE: 30d
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads_data:/usr/src/app/src/uploads
    networks:
      - dhansiri-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhansiri-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dhansiri-network

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  dhansiri-network:
    driver: bridge
